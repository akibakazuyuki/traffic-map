name: Build expressway data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_expressways.py, .github/workflows/expressways.yml]
  schedule:
    - cron: "0 18 1 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: curl -sSfL -o japan.osm.pbf https://download.geofabrik.de/asia/japan-latest.osm.pbf && ls -la japan.osm.pbf
      - run: |
          osmium tags-filter japan.osm.pbf w/highway=motorway,trunk n/highway=motorway_junction nwr/highway=services,rest_area -o hw.osm.pbf
          osmium export hw.osm.pbf -f geojsonseq --geometry-types=point,linestring,polygon -o hw.geojsonseq
          ls -la hw.osm.pbf hw.geojsonseq
      - run: mkdir -p data && python3 scripts/build_expressways.py hw.geojsonseq
      - run: ls -la data && gzip -c data/expressways.json | wc -c
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/expressways.json
          git diff --cached --quiet || (git commit -m "Update expressway data from OpenStreetMap" && git push)

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1418">
<title>ハイウェイ・レーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Semi+Condensed:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  color-scheme:dark;
  --asphalt:#0d1418; --deck:#152026; --deck2:#1d2b33; --line:#2a3a44;
  --ink:#eef3f5; --muted:#8fa3ad;
  --sign:#0b7a4b; --sign-ink:#ffffff;        /* 高速道路の案内標識の緑 */
  --accident:#ff4d4f; --jam:#ff9f1a; --slow:#ffd23f; --closed:#b36bff; --works:#4db8ff; --ok:#3ddc84;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--asphalt);color:var(--ink);font:15px/1.5 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden}
.num,.plate b,.e-no{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--slow);outline-offset:2px}

#map{position:fixed;inset:0;background:var(--asphalt)}
.maplibregl-ctrl-attrib{background:rgba(13,20,24,.7)!important;color:var(--muted)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}

/* ---- 上部：レーダー計器 ---- */
.gauge{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:1000;
  display:flex;gap:12px;align-items:center;background:rgba(21,32,38,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:18px;padding:10px 12px;max-width:520px}
.radar{flex:0 0 96px;height:96px}
.radar text{font:700 9px "Barlow Semi Condensed",sans-serif;fill:var(--muted)}
.sweep{transform-origin:50px 50px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gauge-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.where{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict{font-size:18px;font-weight:700;line-height:1.3}
.counts{display:flex;gap:6px;flex-wrap:wrap}
.count{display:flex;align-items:baseline;gap:4px;border-radius:8px;padding:2px 8px;background:var(--deck2);font-size:12px}
.count b{font-size:18px;line-height:1}
.count.acc b{color:var(--accident)} .count.jam b{color:var(--jam)} .count.cls b{color:var(--closed)}

/* ---- 右：操作ボタン ---- */
.fabs{position:fixed;right:12px;z-index:1000;display:flex;flex-direction:column;gap:10px;
  bottom:calc(var(--sheet-h,168px) + 14px + env(safe-area-inset-bottom,0px));transition:bottom .25s}
.fab{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--deck);display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1.1;text-align:center}
.fab svg{width:22px;height:22px}
.fab.on{background:var(--sign);border-color:var(--sign)}
.recenter{position:fixed;left:50%;transform:translateX(-50%);z-index:1000;top:calc(132px + env(safe-area-inset-top,0px));
  background:var(--slow);color:#1a1a1a;border:0;border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4)}

/* ---- 下：シート（道路ごとの一覧） ---- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:var(--deck);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;height:var(--sheet-h,168px);transition:height .25s;
  padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto}
.handle{border:0;background:none;padding:10px 16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.handle i{width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.sheet-head h2{margin:0;font-size:15px}
.legend{display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-left:4px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);font-weight:700}
.list{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.item{display:grid;grid-template-columns:6px 1fr auto;gap:10px;align-items:stretch;background:var(--deck2);border:0;border-radius:12px;padding:10px 12px 10px 0;text-align:left;width:100%}
.stripe{border-radius:0 4px 4px 0}
.item .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.road{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.e-no{background:var(--sign);color:var(--sign-ink);border:1.5px solid #fff;border-radius:5px;padding:0 5px;font-size:13px;font-weight:700;line-height:1.35}
.rname{font-weight:700;font-size:14px}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;color:#111}
.sect{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.side b{font-size:20px;color:var(--ink);line-height:1}
.empty{color:var(--muted);font-size:14px;padding:16px 4px;text-align:center}
.demo-flag{background:var(--slow);color:#1a1a1a;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px}

/* ---- 設定・場所パネル ---- */
.panel{position:fixed;inset:0;z-index:2000;background:rgba(5,9,11,.6);display:flex;align-items:flex-end;justify-content:center}
.panel-card{background:var(--deck);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
.panel-card h3{margin:0;font-size:18px}
.panel-card p{margin:0;color:var(--muted);font-size:13px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.steps a{color:var(--slow)}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--asphalt);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--sign);color:var(--sign-ink)}
.btn.ghost{background:var(--deck2);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.regions button{border:1px solid var(--line);background:var(--deck2);border-radius:10px;padding:10px 4px;font-size:14px}
.regions small{display:block;color:var(--muted);font-size:11px}

.me{width:18px;height:18px;border-radius:50%;background:#4db8ff;border:3px solid #fff;box-shadow:0 0 0 0 rgba(77,184,255,.7);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 16px rgba(77,184,255,0)}100%{box-shadow:0 0 0 0 rgba(77,184,255,0)}}
.pin{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px "BIZ UDPGothic",sans-serif;color:#111;border:2px solid #0d1418;box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:pointer}
.pinwrap{display:flex;align-items:center;gap:4px;cursor:pointer}
.pinlbl{display:flex;align-items:center;gap:4px;background:rgba(13,20,24,.85);border-radius:6px;padding:2px 6px 2px 3px;font-size:12px;font-weight:700;white-space:nowrap}
.pinlbl .e-no{font-size:12px}
.maplibregl-popup-content{background:var(--deck);color:var(--ink);font-size:13px;border-radius:10px;padding:10px 12px}
.maplibregl-popup-tip{border-top-color:var(--deck)!important;border-bottom-color:var(--deck)!important}
.maplibregl-popup-close-button{color:var(--muted);font-size:18px}

@media (min-width:900px){
  .sheet{left:12px;right:auto;top:calc(128px + env(safe-area-inset-top,0px));bottom:12px;width:400px;height:auto!important;border-radius:18px;border:1px solid var(--line);margin:0}
  .handle{cursor:default}.handle i{display:none}
  .fabs{bottom:24px!important}
}
@media (prefers-reduced-motion:reduce){.sweep,.me{animation:none}.sheet,.fabs{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="地図"></div>

<section class="gauge" aria-live="polite">
  <svg class="radar" viewBox="0 0 100 100" aria-hidden="true">
    <defs><radialGradient id="rg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0b7a4b" stop-opacity=".35"/><stop offset="1" stop-color="#0b7a4b" stop-opacity="0"/></radialGradient>
      <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc84" stop-opacity="0"/><stop offset="1" stop-color="#3ddc84" stop-opacity=".45"/></linearGradient></defs>
    <circle cx="50" cy="50" r="46" fill="url(#rg)" stroke="#2a3a44"/>
    <circle cx="50" cy="50" r="30.7" fill="none" stroke="#2a3a44" stroke-dasharray="2 3"/>
    <circle cx="50" cy="50" r="15.3" fill="none" stroke="#2a3a44" stroke-dasharray="2 3"/>
    <path class="sweep" d="M50 50 L96 50 A46 46 0 0 0 82.5 17.5 Z" fill="url(#sw)"/>
    <text x="50" y="9" text-anchor="middle">N</text>
    <text x="52" y="33" id="rLabel">30</text>
    <g id="blips"></g>
    <circle cx="50" cy="50" r="3.5" fill="#4db8ff" stroke="#fff" stroke-width="1.2"/>
  </svg>
  <div class="gauge-body">
    <div class="where" id="where">現在地を探しています…</div>
    <div class="verdict" id="verdict">周辺の高速道路を確認中</div>
    <div class="counts">
      <span class="count acc"><b class="num" id="cAcc">–</b>事故</span>
      <span class="count jam"><b class="num" id="cJam">–</b>渋滞</span>
      <span class="count cls"><b class="num" id="cCls">–</b>通行止・規制</span>
    </div>
  </div>
</section>

<button class="recenter" id="searchHere" type="button" hidden>この付近を調べる</button>

<div class="fabs">
  <button class="fab" id="btnLocate" type="button" aria-label="現在地に戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <button class="fab" id="btnPlace" type="button">地方</button>
  <button class="fab" id="btnKey" type="button">設定</button>
</div>

<section class="sheet" id="sheet">
  <button class="handle" id="handle" type="button" aria-expanded="false" aria-controls="list">
    <i></i>
    <span class="sheet-head"><h2 id="listTitle">高速道路の事故・渋滞（近い順）</h2><span class="num" id="updated" style="color:var(--muted);font-size:12px"></span></span>
  </button>
  <div style="padding:0 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div class="legend" aria-label="凡例"><i style="background:var(--ok)"></i>順調<i style="background:var(--slow)"></i>混雑<i style="background:var(--jam)"></i>渋滞<i style="background:var(--accident)"></i>ほぼ停止</div>
    <button class="btn ghost" id="btnRefresh" type="button" style="padding:6px 12px;font-size:13px">更新</button>
  </div>
  <div class="list" id="list"></div>
</section>

<div class="panel" id="keyPanel" hidden>
  <div class="panel-card" role="dialog" aria-labelledby="keyTitle">
    <h3 id="keyTitle">渋滞データの接続</h3>
    <p>事故と渋滞の情報は TomTom から取得します。無料キーを一度入れるだけで、以後はこのスマホで自動的に使われます。</p>
    <ol class="steps">
      <li><a href="https://my.tomtom.com/" target="_blank" rel="noopener">my.tomtom.com</a> で無料登録・ログインする</li>
      <li>ログインしたまま <a href="https://my.tomtom.com/" target="_blank" rel="noopener">キーの一覧ページ</a> を開き、表示される英数字のキーをコピーする</li>
      <li>下の欄に貼り付けて「接続」を押す</li>
    </ol>
    <form class="field" id="keyForm">
      <input id="keyInput" type="text" placeholder="APIキーを貼り付け" autocomplete="off" spellcheck="false" aria-label="TomTom APIキー">
      <button class="btn" type="submit">接続</button>
    </form>
    <p>キーはこのブラウザの中にだけ保存され、外部には公開されません。</p>
    <div class="row"><button class="btn ghost" id="btnDemo" type="button">サンプルで試す</button><button class="btn ghost" id="closeKey" type="button">閉じる</button></div>
  </div>
</div>

<div class="panel" id="placePanel" hidden>
  <div class="panel-card" role="dialog" aria-labelledby="placeTitle">
    <h3 id="placeTitle">見たい場所</h3>
    <form class="field" id="placeForm">
      <input id="placeInput" type="search" placeholder="地名・IC名（例：海老名、御殿場）" aria-label="地名で探す">
      <button class="btn" type="submit">探す</button>
    </form>
    <div class="regions" id="regions"></div>
    <div class="row"><button class="btn ghost" id="closePlace" type="button">閉じる</button></div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function(){
"use strict";
var RADIUS_KM = 45, REFRESH_MS = 120000;

  1:{k:"acc",t:"事故",h:"#ff4d4f"}, 14:{k:"acc",t:"故障車",h:"#ff4d4f"},

    ]

});

function shieldImage(){
  var r=2, w=24*r, h=24*r, c=document.createElement("canvas"); c.width=w; c.height=h;

}

  return {type:"Feature",geometry:{type:"LineString",coordinates:pts},properties:{}};

var EMPTY={type:"FeatureCollection",features:[]};

map.on("load",function(){

  map.addLayer({id:"lbl-no",type:"symbol",source:"gsi","source-layer":"Anno",filter:["==",ANNO_CODE,2904],

    paint:{"text-color":"#ffffff"}});
  map.addLayer({id:"lbl-name",type:"symbol",source:"gsi","source-layer":"Anno",filter:["all",["==",ANNO_CODE,411],HWY_NAME],
    layout:{"text-field":ANNO_TEXT,"text-font":["Open Sans Semibold"],"text-size":["interpolate",["linear"],["zoom"],6,11,12,14],"symbol-sort-key":2},
    paint:{"text-color":"#bfe8d2","text-halo-color":"#0d1418","text-halo-width":2}});
  map.addLayer({id:"lbl-ic",type:"symbol",source:"gsi","source-layer":"Anno",minzoom:9,filter:["all",[">=",ANNO_CODE,2941],["<=",ANNO_CODE,2945]],
    layout:{"text-field":ANNO_TEXT,"text-font":["Open Sans Semibold"],"text-size":11,"symbol-sort-key":3},
    paint:{"text-color":"#93a9b4","text-halo-color":"#0d1418","text-halo-width":1.5}});
  ready=true;
  setFlow();
  if(focus) drawFocus(false);
  render();
});

// ---- TomTom 混雑度（高速道路のみ） ----
function flowUrl(){ return "https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.pbf?key="+encodeURIComponent(key)+"&t="+Date.now(); }
function setFlow(){
  if(!ready) return;
  if(map.getLayer("flow")) map.removeLayer("flow");
  if(map.getSource("flow")) map.removeSource("flow");
  if(!key) return;
  map.addSource("flow",{type:"vector",tiles:[flowUrl()],maxzoom:18,attribution:"交通情報 &copy; TomTom"});
  var lvl=["to-number",["get","traffic_level"],1];
  map.addLayer({id:"flow",type:"line",source:"flow","source-layer":"Traffic flow",filter:["==",["get","road_type"],"Motorway"],
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":["case",["==",["to-string",["get","road_closure"]],"true"],"#b36bff",
      ["step",lvl,"#ff4d4f",0.25,"#ff9f1a",0.5,"#ffd23f",0.75,"#3ddc84"]],
      "line-width":["interpolate",["linear"],["zoom"],5,1.5,10,3.5,14,7]}}, "inc-line");
}
function refreshFlow(){ var s=map.getSource("flow"); if(s && s.setTiles) s.setTiles([flowUrl()]); }

// ---- 位置 ----
function km(a,b){ var R=6371,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(s)); }
function bearing(a,b){ var y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);
  var x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
  return Math.atan2(y,x); }
function pad(){ return {top:130,bottom:(window.innerWidth>=900?40:180),left:(window.innerWidth>=900?420:20),right:70}; }
function drawFocus(animate){
  var ring=circlePoly(focus,RADIUS_KM);
  if(ready) map.getSource("ring").setData(ring);
  var b=new maplibregl.LngLatBounds(); ring.geometry.coordinates.forEach(function(c){ b.extend(c); });
  map.fitBounds(b,{padding:pad(),animate:animate});
}
function setFocus(ll,label){
  focus=ll;
  $("where").textContent=label+"から半径"+RADIUS_KM+"km";
  drawFocus(true);
  $("searchHere").hidden=true;
  load();
}
var meMarker=null;
function placeMe(){
  if(!meMarker){ var el=document.createElement("div"); el.className="me"; meMarker=new maplibregl.Marker({element:el}).setLngLat([me[1],me[0]]).addTo(map); }
  else meMarker.setLngLat([me[1],me[0]]);
}
function locate(){
  if(!navigator.geolocation){ noLocation(); return; }
  $("where").textContent="現在地を探しています…";
  navigator.geolocation.getCurrentPosition(function(p){
    me=[p.coords.latitude,p.coords.longitude]; placeMe(); setFocus(me,"現在地");
  }, noLocation, {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
function noLocation(){
  $("where").textContent="現在地が取れませんでした";
  $("verdict").textContent="「地方」から場所を選んでください";
  if(!focus) setFocus([35.68,139.77],"東京周辺");
}
if(navigator.geolocation){
  navigator.geolocation.watchPosition(function(p){ me=[p.coords.latitude,p.coords.longitude]; if(meMarker) placeMe(); },function(){}, {enableHighAccuracy:true,maximumAge:30000});
}

// ---- 事故・渋滞データ ----
function isHighway(inc){
  var p=inc.properties||{}, rn=(p.roadNumbers||[]).join(" ");
  if(/(^|\s)[EC]\d/.test(rn)) return true;
  var txt=(p.from||"")+" "+(p.to||"")+" "+rn;
  return /IC|JCT|ＩＣ|ＪＣＴ|SA|PA|料金所|インター|ジャンクション|高速|自動車道|首都高|阪神高速/.test(txt);
}
function roadLabel(p){
  var nums=p.roadNumbers||[]; var e=nums.filter(function(n){return /^[EC]\d/.test(n);})[0];
  return {no:e||nums[0]||"", name:e&&ROADS[e]?ROADS[e]:(nums.length?"":"路線名不明")};
}
function coordsOf(inc){
  var g=inc.geometry||{}, c=g.coordinates||[];
  var pts = g.type==="Point" ? [c] : c;
  return pts.map(function(x){return [x[1],x[0]];});
}
function nearest(pts,ll){ var best=pts[0],bd=1e9; pts.forEach(function(p){ var d=km(ll,p); if(d<bd){bd=d;best=p;} }); return {p:best,d:bd}; }

function load(){
  if(!focus) return;
  if(!key && !demo){ render(); return; }
  var my=++seq;
  $("updated").textContent="取得中…";
  if(demo){ incidents=sampleData(); render(); stamp(); return; }
  var dLat=RADIUS_KM/111, dLon=RADIUS_KM/(111*Math.cos(focus[0]*Math.PI/180));
  var bbox=[focus[1]-dLon,focus[0]-dLat,focus[1]+dLon,focus[0]+dLat].map(function(v){return v.toFixed(4);}).join(",");
  var fields="{incidents{type,geometry{type,coordinates},properties{id,iconCategory,magnitudeOfDelay,events{description,code},startTime,from,to,length,delay,roadNumbers}}}";
  var url="https://api.tomtom.com/traffic/services/5/incidentDetails?key="+encodeURIComponent(key)+"&bbox="+bbox+
    "&fields="+encodeURIComponent(fields)+"&language=ja-JP&timeValidityFilter=present";
  fetch(url).then(function(r){ if(r.status===403||r.status===401) throw new Error("key"); if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(j){ if(my!==seq) return; incidents=j.incidents||[]; render(); stamp(); })
  .catch(function(e){ if(my!==seq) return;
    $("updated").textContent="";
    $("verdict").textContent = e.message==="key" ? "APIキーが使えません。設定を確認してください" : "交通情報を取得できませんでした";
    $("list").innerHTML='<div class="empty">通信状況を確認して「更新」を押してください。</div>';
  });
}
function stamp(){ $("updated").textContent=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+" 更新"; if(demo) $("updated").innerHTML+='<span class="demo-flag">サンプル</span>'; }

var pins=[], popup=null;
function showPopup(r,html){ if(popup) popup.remove(); popup=new maplibregl.Popup({offset:16,maxWidth:"260px"}).setLngLat([r.pts[0][1],r.pts[0][0]]).setHTML(html).addTo(map); }
function render(){
  pins.forEach(function(m){ m.remove(); }); pins=[];
  if(ready) map.getSource("inc").setData(EMPTY);
  if(!focus) return;
  if(!key && !demo){
    $("verdict").textContent="渋滞データが未接続です";
    ["cAcc","cJam","cCls"].forEach(function(id){ $(id).textContent="–"; });
    $("blips").innerHTML="";
    $("list").innerHTML='<div class="empty">右の「設定」から渋滞データを接続すると、ここに高速道路の事故・渋滞が並びます。地図上の緑の番号は高速道路の路線番号です。</div>';
    return;
  }
  var rows = incidents.filter(isHighway).map(function(i){
    var pts=coordsOf(i); if(!pts.length) return null;
    var n=nearest(pts,focus);
    return {i:i,p:i.properties||{},pts:pts,near:n.p,dist:n.d,cat:cat((i.properties||{}).iconCategory)};
  }).filter(function(r){ return r && r.dist<=RADIUS_KM*1.05; });
  var rank={acc:0,cls:1,jam:2,etc:3};
  rows.sort(function(a,b){ return a.dist-b.dist; });

  var n={acc:0,jam:0,cls:0};
  rows.forEach(function(r){ if(n[r.cat.k]!==undefined) n[r.cat.k]++; });
  $("cAcc").textContent=n.acc; $("cJam").textContent=n.jam; $("cCls").textContent=n.cls;
  $("verdict").textContent = n.acc ? "事故 "+n.acc+"件。近くの高速道路に注意" :
    n.jam ? "事故なし。渋滞が"+n.jam+"か所" : n.cls ? "事故・渋滞なし。規制が"+n.cls+"か所" : "周辺の高速道路は順調です";

  var g=$("blips"); g.innerHTML="";
  rows.slice().sort(function(a,b){return rank[b.cat.k]-rank[a.cat.k];}).forEach(function(r){
    var d=Math.min(r.dist,RADIUS_KM)/RADIUS_KM*46, a=bearing(focus,r.near);
    var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",(50+d*Math.sin(a)).toFixed(1)); c.setAttribute("cy",(50-d*Math.cos(a)).toFixed(1)); c.setAttribute("r",r.cat.k==="acc"?3.6:2.6);
    c.setAttribute("fill",r.cat.h); c.setAttribute("stroke","#0d1418"); c.setAttribute("stroke-width","1");
    g.appendChild(c);
  });

  var feats=[], list=$("list"); list.innerHTML="";
  if(!rows.length) list.innerHTML='<div class="empty">半径'+RADIUS_KM+'km以内の高速道路に事故・渋滞・規制はありません。</div>';
  rows.forEach(function(r){
    var p=r.p, rl=roadLabel(p);
    var desc=(p.events||[]).map(function(e){return e.description;}).filter(Boolean).join("・");
    var delayMin=p.delay?Math.round(p.delay/60):0, lenKm=p.length?(p.length/1000):0;
    var sect=(p.from||"")+(p.to?" → "+p.to:"");
    if(r.pts.length>1) feats.push({type:"Feature",properties:{color:r.cat.h},geometry:{type:"LineString",coordinates:r.pts.map(function(x){return [x[1],x[0]];})}});
    var html='<b>'+esc(r.cat.t)+'</b>　'+esc(rl.no)+' '+esc(rl.name)+'<br>'+esc(sect)+(desc?'<br>'+esc(desc):'')+
      (delayMin?'<br>遅れ 約'+delayMin+'分':'')+(lenKm?'・長さ '+lenKm.toFixed(1)+'km':'');
    var el=document.createElement("div"); el.className="pinwrap";
    el.innerHTML='<span class="pin" style="background:'+r.cat.h+'">'+esc(r.cat.t.charAt(0))+'</span>'+
      (rl.no||rl.name?'<span class="pinlbl">'+(rl.no?'<span class="e-no">'+esc(rl.no)+'</span>':'')+esc(rl.name)+'</span>':'');
    el.onclick=function(ev){ ev.stopPropagation(); showPopup(r,html); };
    pins.push(new maplibregl.Marker({element:el,anchor:"left",offset:[-13,0]}).setLngLat([r.pts[0][1],r.pts[0][0]]).addTo(map));

    var b=document.createElement("button"); b.type="button"; b.className="item";
    b.innerHTML='<span class="stripe" style="background:'+r.cat.h+'"></span>'+
      '<span class="main"><span class="road"><span class="tag" style="background:'+r.cat.h+'">'+esc(r.cat.t)+'</span>'+
      (rl.no?'<span class="e-no">'+esc(rl.no)+'</span>':'')+'<span class="rname">'+esc(rl.name)+'</span></span>'+
      '<span class="sect">'+esc(sect||"区間情報なし")+'</span>'+(desc?'<span class="desc">'+esc(desc)+'</span>':'')+'</span>'+
      '<span class="side"><span><b class="num">'+(r.dist<1?"<1":Math.round(r.dist))+'</b> km先</span>'+
      (delayMin?'<span class="num">+'+delayMin+'分</span>':'')+(lenKm>=0.1?'<span class="num">'+lenKm.toFixed(1)+'km</span>':'')+'</span>';
    b.onclick=function(){
      var bb=new maplibregl.LngLatBounds(); r.pts.forEach(function(x){ bb.extend([x[1],x[0]]); });
      map.fitBounds(bb,{padding:pad(),maxZoom:13}); showPopup(r,html); setSheet(false);
    };
    list.appendChild(b);
  });
  if(ready) map.getSource("inc").setData({type:"FeatureCollection",features:feats});
}

// ---- 画面操作 ----
function setSheet(open){
  document.documentElement.style.setProperty("--sheet-h",(open?Math.round(window.innerHeight*0.62):168)+"px");
  $("handle").setAttribute("aria-expanded",open?"true":"false");
}
$("handle").onclick=function(){ setSheet($("handle").getAttribute("aria-expanded")!=="true"); };
$("btnRefresh").onclick=function(){ refreshFlow(); load(); };
$("btnLocate").onclick=locate;

function openKey(){ $("keyInput").value=key; $("keyPanel").hidden=false; }
$("btnKey").onclick=openKey;
$("closeKey").onclick=function(){ $("keyPanel").hidden=true; };
$("keyForm").addEventListener("submit",function(e){ e.preventDefault(); key=$("keyInput").value.trim(); ls("tt_key",key||null); demo=false; $("keyPanel").hidden=true; setFlow(); load(); });
$("btnDemo").onclick=function(){ demo=true; $("keyPanel").hidden=true; setFocus([35.681,139.767],"東京駅（サンプル）"); };

var rg=$("regions");
REGIONS.forEach(function(r){ var b=document.createElement("button"); b.type="button"; b.innerHTML=esc(r[0])+"<small>"+esc(r[1])+"周辺</small>";
  b.onclick=function(){ $("placePanel").hidden=true; setFocus([r[2],r[3]],r[1]+"周辺"); }; rg.appendChild(b); });
$("btnPlace").onclick=function(){ $("placePanel").hidden=false; };
$("closePlace").onclick=function(){ $("placePanel").hidden=true; };
[$("keyPanel"),$("placePanel")].forEach(function(p){ p.addEventListener("click",function(e){ if(e.target===p) p.hidden=true; }); });
$("placeForm").addEventListener("submit",function(e){
  e.preventDefault(); var q=$("placeInput").value.trim(); if(!q) return;
  fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(a){
    if(!a||!a.length){ $("placeInput").value=""; $("placeInput").placeholder="見つかりませんでした。別の地名で"; return; }
    var c=a[0].geometry.coordinates; $("placePanel").hidden=true; setFocus([c[1],c[0]],q+"周辺");
  }).catch(function(){ $("placeInput").placeholder="地名検索に接続できませんでした"; });
});

map.on("moveend",function(){ if(!focus) return; var c=map.getCenter(); $("searchHere").hidden = km(focus,[c.lat,c.lng]) < RADIUS_KM*0.5; });
$("searchHere").onclick=function(){ var c=map.getCenter(); setFocus([c.lat,c.lng],"地図の中心"); };

setInterval(function(){ if(document.visibilityState==="visible"){ refreshFlow(); load(); } }, REFRESH_MS);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") load(); });

$("rLabel").textContent=Math.round(RADIUS_KM*2/3);
setSheet(false);
if(!key) openKey();
locate();
})();
